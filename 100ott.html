<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni OTT - Video Player</title>
    <!-- FontAwesome আইকনের জন্য -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 380px; /* রিলস ফরম্যাট সাইজ */
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        /* ভিডিও প্লেয়ার কন্টেইনার */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16; /* রিলস ৯:১৬ অনুপাত */
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* বাফারিং বা লোডিং স্পিনার (যখন ভিডিও লোড বা বাফার হবে তখন দেখাবে) */
        .buffering-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            display: none; /* ডিফল্ট বন্ধ থাকবে, বাফারিংয়ের সময় অন হবে */
            z-index: 10;
            pointer-events: none;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* প্রথমবার সাউন্ডসহ প্লে করার জন্য ওভারলে বাটন */
        .unmute-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            z-index: 8;
            transition: opacity 0.3s;
        }

        .unmute-overlay i {
            font-size: 40px;
            color: #fff;
            background: rgba(255, 0, 0, 0.8);
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .unmute-overlay span {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* ওয়াটারমার্ক ডিজাইন (30% Opacity & Bold) */
        .watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 16px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 5;
        }

        /* ইউটিউব স্টাইল কাস্টম কন্ট্রোলস বার */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 7;
        }

        .video-container:hover .video-controls,
        .video-container.touch-active .video-controls {
            opacity: 1;
        }

        /* প্রোগ্রেস বা ডিউরেশন বার */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #ff0000; /* ইউটিউব রেড */
            width: 0%;
            border-radius: 3px;
        }

        .control-buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: #ff0000;
        }

        .time-display {
            font-size: 11px;
            color: #ddd;
        }

        /* ভিডিওর নিচের সেকশন */
        .content-section {
            padding: 15px;
            text-align: center;
        }

        .package-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffcc00;
            margin-bottom: 12px;
            letter-spacing: 0.
